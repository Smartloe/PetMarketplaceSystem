[project]
name = "pet-shop-backend"
version = "0.1.0"
description = "Django backend for the Pet Marketplace System"
requires-python = ">=3.10"

# Only direct dependencies are listed; uv resolves the transitive set into
# uv.lock. The previous list pinned ~50 packages, most of which were
# transitive deps of libraries the code never imported:
#   - alipay-sdk-python AND python-alipay-sdk (two competing SDKs, neither
#     imported anywhere) plus their crypto chain: cffi, cryptography,
#     pycryptodome(x), pyopenssl, pyasn1, rsa, simplejson
#   - django-jazzmin and django-grappelli (only simpleui is in INSTALLED_APPS)
#   - django-chartjs, django-echarts, echarts-python, pyecharts — the admin
#     charts load ECharts from a CDN in the templates, not via Python
# Dropping the alipay chain also removed the cffi==1.16.0 pin, which was the
# reason the project could not build on Python 3.13.
dependencies = [
	# Framework and API layer
	"django==5.0.4",
	"djangorestframework==3.15.1",
	"djangorestframework-simplejwt==5.3.1",
	# INSTALLED_APPS entries (loaded by app label, not imported by our code)
	"django-cors-headers==4.3.1",
	"django-simpleui==2024.4.1",
	# Admin import/export actions
	"django-import-export==4.0.7",
	# Phone number model field + its validation data
	"django-phonenumber-field==7.3.0",
	"phonenumbers==8.13.36",
	# Swagger / ReDoc schema UI
	"drf-yasg==1.21.7",
	# drf-yasg 1.21.7 still imports pkg_resources at module load, which ships
	# with setuptools and is no longer bundled on Python 3.12+. Without this
	# the whole project fails to import.
	"setuptools==75.1.0",
	# MySQL driver
	"pymysql==1.1.0",
	# ImageField handling and captcha image generation
	"pillow==10.3.0",
	# Outbound HTTP for the LongCat AI endpoint
	"requests==2.32.3",
	# .env loading in settings.py
	"python-dotenv==1.0.0",
	"langchain>=0.3,<0.4",
	"langchain-core>=0.3,<0.4",
	"langchain-openai>=0.2,<0.4",
	"langgraph>=0.2,<0.7",
	"numpy>=1.26,<3",
]
